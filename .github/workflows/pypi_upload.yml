name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/absl-py
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: pip install -U build

    - name: Build package
      run: python -m build

    - name: Authenticate to Google Cloud (OSS Exit Gate)
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Clean up failed staging attempt for this exact version (if any)
      id: exit_gate_cleanup
      run: |
        set -euo pipefail
        PKG_VER=$(python3 - <<'PY'
        import email, glob, tarfile, zipfile
        files = sorted(glob.glob("dist/**/*.whl", recursive=True) + glob.glob("dist/**/*.tar.gz", recursive=True))
        assert files, "No distributions found in dist/"
        f = files[0]
        if f.endswith(".whl"):
          with zipfile.ZipFile(f) as zf:
            meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
            raw = zf.read(meta).decode()
        else:
          with tarfile.open(f) as tf:
            info = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]
            raw = tf.extractfile(info).read().decode()
        print(email.message_from_string(raw)["Version"].strip())
        PY
        )
        echo "pkg_ver=${PKG_VER}" >> "$GITHUB_OUTPUT"
        if gcloud artifacts versions describe "${PKG_VER}" \
          --package="absl-py" \
          --project="oss-exit-gate-prod" \
          --location="us" \
          --repository="abseil-py--pypi" >/dev/null 2>&1; then
          gcloud artifacts versions delete "${PKG_VER}" \
            --package="absl-py" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="abseil-py--pypi" \
            --quiet
        fi

    - name: Stage distributions to OSS Exit Gate and upload manifest
      env:
        PKG_VER: ${{ steps.exit_gate_cleanup.outputs.pkg_ver }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        shopt -s globstar nullglob
        DIST_FILES=(dist/**/*.whl dist/**/*.tar.gz)
        python3 -m pip install --upgrade twine
        TWINE_PASSWORD="$(gcloud auth print-access-token)"
        python3 -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/abseil-py--pypi/" \
          -u oauth2accesstoken \
          -p "${TWINE_PASSWORD}" \
          "${DIST_FILES[@]}"
        cat <<EOF > manifest.json
        {
          "publish_all": false,
          "publishing_groups": [
            {
              "packages": [
                {
                  "name": "absl-py",
                  "version": "${PKG_VER}"
                }
              ]
            }
          ]
        }
        EOF
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/abseil-py/pypi/manifests/manifest-${PKG_VER}-${RUN_ID}-${RUN_ATTEMPT}.json"

